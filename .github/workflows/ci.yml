name: CI

on:
  push:
    branches-ignore:
      - rss-state
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: ビルド
        run: go build -o "$RUNNER_TEMP/rss-curator" .
      - name: テスト
        run: go test ./...
      - name: 静的解析
        run: go vet ./...
